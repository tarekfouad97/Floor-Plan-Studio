<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apartment Furniture Planner</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2430; --muted:#6b7684;
    --line:#d9dee5; --accent:#2f6fd0; --accent-soft:#e8f0fb; --warn:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);overflow:hidden}
  button,input,select{font:inherit;color:inherit}

  #app{display:grid;grid-template-columns:250px 1fr 290px;grid-template-rows:48px 1fr;height:100%}
  #bar{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 12px;
       background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
  #bar h1{font-size:14px;margin:0 14px 0 0;white-space:nowrap;font-weight:650}
  #bar .sp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;
       cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f0f3f7}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}

  aside{background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
  #cat{border-right:1px solid var(--line)}
  #side{border-left:1px solid var(--line)}
  .pad{padding:10px 12px}
  .hd{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
      font-weight:700;padding:12px 12px 6px}
  #search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}

  .grp{border-top:1px solid var(--line)}
  .grp>summary{cursor:pointer;padding:8px 12px;font-weight:650;font-size:13px;list-style:none;
       display:flex;align-items:center;gap:8px}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sw,#999)}
  .it{display:flex;justify-content:space-between;gap:8px;align-items:center;
      padding:5px 12px 5px 29px;cursor:grab;font-size:13px}
  .it:hover{background:var(--accent-soft)}
  .it .d{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}

  #stage{position:relative;overflow:hidden;background:var(--bg)}
  svg#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
  #hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:12px;
        background:rgba(255,255,255,.9);padding:4px 8px;border-radius:6px;pointer-events:none}
  #zoombox{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}

  .row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .row label{width:74px;color:var(--muted);font-size:12px}
  .row input[type=number],.row input[type=text],.row select{
      flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .empty{color:var(--muted);font-size:13px;padding:4px 12px 12px}
  .warn{background:#fff3ea;border:1px solid #f5c9a8;color:var(--warn);
        border-radius:7px;padding:7px 9px;font-size:12px;margin:8px 12px}

  table.bom{width:100%;border-collapse:collapse;font-size:12px}
  table.bom th,table.bom td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
  table.bom th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  table.bom td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.bom tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}

  #printonly{display:none}
  @page{size:A4 landscape;margin:10mm}
  @media print{
    body{overflow:visible;background:#fff}
    #app{display:block;height:auto}
    #bar,#cat,#side,#hint,#zoombox{display:none!important}
    #stage{overflow:visible;height:auto;background:#fff}
    svg#plan{width:100%;height:170mm}
    #printonly{display:block;break-before:page;padding-top:6mm}
    #printonly h2{font-size:13pt;margin:0 0 3mm}
    #printonly table{width:100%;border-collapse:collapse;font-size:9pt}
    #printonly th,#printonly td{border:1px solid #999;padding:2mm 2.5mm;text-align:left}
    #printonly td.n{text-align:right}
  }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <h1>Apartment Planner</h1>
    <button class="btn" id="bRot">Rotate 90° <small>(R)</small></button>
    <button class="btn" id="bDup">Duplicate <small>(D)</small></button>
    <button class="btn" id="bDel">Delete <small>(⌫)</small></button>
    <button class="btn" id="bUndo">Undo <small>(⌘Z)</small></button>
    <span style="width:1px;height:22px;background:var(--line)"></span>
    <button class="btn" id="bTape">📏 Measure</button>
    <button class="btn" id="bGrid">Grid</button>
    <button class="btn" id="bLabels">Sizes</button>
    <span class="sp"></span>
    <button class="btn" id="bSave">Save</button>
    <button class="btn" id="bExport">Export JSON</button>
    <button class="btn" id="bImport">Import</button>
    <button class="btn" id="bPng">PNG</button>
    <button class="btn pri" id="bPrint">Print / PDF</button>
  </div>

  <aside id="cat">
    <div class="pad"><input id="search" placeholder="Search furniture…" autocomplete="off"></div>
    <div id="cats"></div>
    <div class="pad" style="color:var(--muted);font-size:11px;border-top:1px solid var(--line)">
      Drag an item onto the plan, or click it to drop in the middle.
    </div>
  </aside>

  <div id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint">Drag to move · R rotate · ⌫ delete · scroll to zoom · drag empty space to pan</div>
    <div id="zoombox">
      <button class="btn" id="bZo">−</button>
      <button class="btn" id="bFit">Fit</button>
      <button class="btn" id="bZi">+</button>
    </div>
  </div>

  <aside id="side">
    <div class="hd">Selected item</div>
    <div id="props"><div class="empty">Nothing selected.</div></div>
    <div id="warns"></div>
    <div class="hd" style="border-top:1px solid var(--line)">Shopping list</div>
    <div id="bom"></div>
  </aside>
</div>

<div id="printonly">
  <h2>Shopping list — measurements in centimetres</h2>
  <div id="bomPrint"></div>
</div>

/* =====================================================================
   3. STATE
   ===================================================================== */
const S = {
  items: [], sel:null,
  view: { x:BOUNDS.x, y:BOUNDS.y, w:BOUNDS.w },
  showGrid:true, showLabels:true,
  tape:null, tapeMode:false, undo:[]
};
let uid = 1;

const svg   = document.getElementById("plan");
const stage = document.getElementById("stage");
const SVGNS = "http://www.w3.org/2000/svg";

/* ---------- geometry helpers ---------- */
function bbox(it){
  const r = ((it.rot%360)+360)%360, swap = (r===90||r===270);
  const w = swap ? it.d : it.w, h = swap ? it.w : it.d;
  return { x: it.x-w/2, y: it.y-h/2, w, h };
}
const overlap=(a,b)=> a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
const inRect=(x,y,r)=> x>=r[0] && x<=r[0]+r[2] && y>=r[1] && y<=r[1]+r[3];

function rectAt(x,y){
  for(const rm of ROOMS) for(const r of rm.rects) if(inRect(x,y,r)) return {room:rm, r};
  return null;
}
function roomAt(x,y){ const h=rectAt(x,y); return h?h.room:null; }
function roomBBox(rm){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const r of rm.rects){ x0=Math.min(x0,r[0]); y0=Math.min(y0,r[1]);
                            x1=Math.max(x1,r[0]+r[2]); y1=Math.max(y1,r[1]+r[3]); }
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
const roomArea = rm => rm.rects.reduce((s,r)=>s+r[2]*r[3],0);

/* =====================================================================
   4. RENDER
   ===================================================================== */
function viewH(){ return S.view.w * stage.clientHeight / stage.clientWidth; }
function cmPerPx(){ return S.view.w / stage.clientWidth; }
function el(tag, attrs, parent){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) if(attrs[k]!=null) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}

function render(){
  const k = cmPerPx();
  svg.setAttribute("viewBox", `${S.view.x} ${S.view.y} ${S.view.w} ${viewH()}`);
  svg.innerHTML = "";
  const gGrid=el("g",{},svg), gFloor=el("g",{},svg), gWall=el("g",{},svg),
        gDim=el("g",{},svg), gItems=el("g",{},svg), gOver=el("g",{},svg);

  if(S.showGrid){
    const step=50, x0=Math.floor(S.view.x/step)*step, y0=Math.floor(S.view.y/step)*step;
    for(let x=x0;x<S.view.x+S.view.w;x+=step)
      el("line",{x1:x,y1:S.view.y,x2:x,y2:S.view.y+viewH(),
                 stroke:x%100?"#eef2f6":"#e3e9f0","stroke-width":k},gGrid);
    for(let y=y0;y<S.view.y+viewH();y+=step)
      el("line",{x1:S.view.x,y1:y,x2:S.view.x+S.view.w,y2:y,
                 stroke:y%100?"#eef2f6":"#e3e9f0","stroke-width":k},gGrid);
  }

  for(const rm of ROOMS)
    for(const r of rm.rects)
      el("rect",{x:r[0],y:r[1],width:r[2],height:r[3],
                 fill:rm.outdoor?"#f2f5f8":"#ffffff"},gFloor);

  for(const w of WALLS)
    el("rect",{x:w[0],y:w[1],width:w[2],height:w[3],fill:"#1e242c"},gWall);

  for(const rm of ROOMS){
    const b=roomBBox(rm), f=13*k;
    if(b.w < f*4.5 || b.h < f*2.4) continue;
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    el("text",{x:cx,y:cy-2*k,"text-anchor":"middle","font-size":f,fill:"#9aa5b1",
               "font-weight":"600","letter-spacing":0.6*k,"paint-order":"stroke",
               stroke:"#fff","stroke-width":3*k},gDim).textContent=rm.name.toUpperCase();
    el("text",{x:cx,y:cy+13*k,"text-anchor":"middle","font-size":11*k,fill:"#bcc5cf",
               "paint-order":"stroke",stroke:"#fff","stroke-width":3*k},gDim)
      .textContent = `${(roomArea(rm)/10000).toFixed(1)} m²`;
  }

  for(const it of S.items){
    const g = el("g",{transform:`translate(${it.x} ${it.y}) rotate(${it.rot})`,
                      "data-id":it.id, style:"cursor:move"},gItems);
    const w=it.w, d=it.d, hw=w/2, hd=d/2, on=(S.sel===it.id);
    const base={ fill:it.color+"33", stroke:it.color,
                 "stroke-width":on?3:1.6, "vector-effect":"non-scaling-stroke" };
    if(it.shape==="circle") el("ellipse",{cx:0,cy:0,rx:hw,ry:hd,...base},g);
    else if(it.shape==="L"){
      const a=w*0.55,b2=d*0.55;
      el("path",{d:`M ${-hw} ${-hd} L ${hw} ${-hd} L ${hw} ${-hd+b2} L ${-hw+a} ${-hd+b2} L ${-hw+a} ${hd} L ${-hw} ${hd} Z`,...base},g);
    } else {
      el("rect",{x:-hw,y:-hd,width:w,height:d,rx:Math.min(3,w/12),...base},g);
      el("line",{x1:-hw,y1:hd,x2:hw,y2:hd,stroke:it.color,"stroke-width":on?4:2.5,
                 "vector-effect":"non-scaling-stroke",opacity:.75},g);
    }
    if(on) el("rect",{x:-hw-4,y:-hd-4,width:w+8,height:d+8,fill:"none",
                      stroke:"#2f6fd0","stroke-width":1.5,"stroke-dasharray":"6 4",
                      "vector-effect":"non-scaling-stroke"},g);

    if(S.showLabels || on){
      const f=Math.max(9*k,7), rot90=(it.rot===90||it.rot===270);
      const along = rot90 ? d : w, across = rot90 ? w : d;
      const inside = (across > f*2.5) && (along > f*0.54*it.name.length);
      const t=el("text",{x:0,y:inside?-f*0.08:-hd-f*0.7,"text-anchor":"middle",
            "font-size":f,fill:on?"#2f6fd0":"#46515e","font-weight":on?"700":"600",
            transform:rot90?"rotate(-90)":null,"paint-order":"stroke",
            stroke:"#fff","stroke-width":3.2*k,"stroke-linejoin":"round"},g);
      const maxChars=Math.max(5,Math.floor((inside?along:along*2.2)/(f*0.54)));
      el("tspan",{x:0,dy:0},t).textContent =
        it.name.length<=maxChars ? it.name : it.name.slice(0,maxChars-1)+"…";
      el("tspan",{x:0,dy:f*1.05,"font-size":f*0.86,"font-weight":"400",
                  fill:on?"#2f6fd0":"#79838f"},t)
        .textContent = `${Math.round(it.w)}×${Math.round(it.d)} cm`;
    }
  }

  if(S.tape && S.tape.b){
    const {a,b}=S.tape, dist=Math.hypot(b.x-a.x,b.y-a.y);
    el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#c2410c","stroke-width":2*k},gOver);
    for(const p of [a,b]) el("circle",{cx:p.x,cy:p.y,r:4*k,fill:"#c2410c"},gOver);
    el("text",{x:(a.x+b.x)/2,y:(a.y+b.y)/2-8*k,"text-anchor":"middle","font-size":14*k,
        fill:"#c2410c","font-weight":"700","paint-order":"stroke",stroke:"#fff",
        "stroke-width":4*k},gOver).textContent = `${Math.round(dist)} cm`;
  }
  bindItemDrag(gItems);
}

/* =====================================================================
   5. INTERACTION
   ===================================================================== */
function toCm(evt){
  const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY;
  const q=p.matrixTransform(svg.getScreenCTM().inverse());
  return {x:q.x, y:q.y};
}
function snap(it,x,y){
  const TOL=12;
  const r=((it.rot%360)+360)%360, swap=(r===90||r===270);
  const w=swap?it.d:it.w, h=swap?it.w:it.d;
  const hit=rectAt(x,y);
  if(hit){
    const R=hit.r;
    const L=R[0]+w/2, Rt=R[0]+R[2]-w/2, T=R[1]+h/2, B=R[1]+R[3]-h/2;
    if(Math.abs(x-L)<TOL) x=L; else if(Math.abs(x-Rt)<TOL) x=Rt;
    if(Math.abs(y-T)<TOL) y=T; else if(Math.abs(y-B)<TOL) y=B;
  }
  return {x:Math.round(x), y:Math.round(y)};
}

let drag=null;
function bindItemDrag(layer){
  layer.querySelectorAll("g[data-id]").forEach(g=>{
    const id=g.getAttribute("data-id");
    g.addEventListener("pointerdown",e=>{
      if(S.tapeMode) return;
      e.stopPropagation();
      const it=S.items.find(i=>i.id===id);
      select(id);
      const p=toCm(e);
      drag={it,dx:it.x-p.x,dy:it.y-p.y,moved:false};
      g.setPointerCapture(e.pointerId);
    });
    g.addEventListener("pointermove",e=>{
      if(!drag||drag.it.id!==id) return;
      const p=toCm(e);
      if(!drag.moved){ pushUndo(); drag.moved=true; }
      const s=snap(drag.it,p.x+drag.dx,p.y+drag.dy);
      drag.it.x=s.x; drag.it.y=s.y;
      render(); showProps();
    });
    const end=()=>{ if(drag){ drag=null; refreshBom(); } };
    g.addEventListener("pointerup",end);
    g.addEventListener("pointercancel",end);
  });
}

let pan=null;
svg.addEventListener("pointerdown",e=>{
  if(S.tapeMode){
    const p=toCm(e);
    if(!S.tape||S.tape.b) S.tape={a:p,b:null}; else S.tape.b=p;
    render(); return;
  }
  select(null);
  pan={sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",e=>{
  if(!pan) return;
  const k=cmPerPx();
  S.view.x=pan.vx-(e.clientX-pan.sx)*k;
  S.view.y=pan.vy-(e.clientY-pan.sy)*k;
  render();
});
svg.addEventListener("pointerup",()=>pan=null);
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=toCm(e), f=e.deltaY>0?1.12:1/1.12;
  const nw=Math.min(BOUNDS.w*3,Math.max(150,S.view.w*f)), r=nw/S.view.w;
  S.view.x=p.x-(p.x-S.view.x)*r; S.view.y=p.y-(p.y-S.view.y)*r; S.view.w=nw;
  render();
},{passive:false});

svg.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
svg.addEventListener("drop",e=>{
  e.preventDefault();
  const cid=e.dataTransfer.getData("text/plain");
  if(cid) addItem(cid,toCm(e));
});

/* =====================================================================
   6. ITEM OPERATIONS
   ===================================================================== */
function pushUndo(){ S.undo.push(JSON.stringify(S.items)); if(S.undo.length>60) S.undo.shift(); }
function addItem(catalogId,at){
  const c=CATALOG.find(x=>x.id===catalogId); if(!c) return;
  pushUndo();
  const p=at||{x:S.view.x+S.view.w/2, y:S.view.y+viewH()/2};
  const it={id:"i"+(uid++),catalogId:c.id,name:c.name,color:c.color,shape:c.shape,
            w:c.w,d:c.d,x:Math.round(p.x),y:Math.round(p.y),rot:0,note:"",price:""};
  const s=snap(it,it.x,it.y); it.x=s.x; it.y=s.y;
  S.items.push(it); select(it.id); refreshBom(); render();
}
function select(id){ S.sel=id; render(); showProps(); }
function selected(){ return S.items.find(i=>i.id===S.sel); }
function delSel(){ const it=selected(); if(!it) return;
  pushUndo(); S.items=S.items.filter(i=>i.id!==it.id); select(null); refreshBom(); }
function rotSel(){ const it=selected(); if(!it) return;
  pushUndo(); it.rot=(it.rot+90)%360; render(); showProps(); }
function dupSel(){ const it=selected(); if(!it) return;
  pushUndo(); const c={...it,id:"i"+(uid++),x:it.x+30,y:it.y+30};
  S.items.push(c); select(c.id); refreshBom(); }
function undo(){ if(!S.undo.length) return;
  S.items=JSON.parse(S.undo.pop()); select(null); refreshBom(); }

/* =====================================================================
   7. RIGHT PANEL
   ===================================================================== */
function showProps(){
  const box=document.getElementById("props"), it=selected();
  if(!it){ box.innerHTML='<div class="empty">Nothing selected.</div>'; checkWarnings(); return; }
  const room=roomAt(it.x,it.y);
  box.innerHTML=`
    <div class="pad">
      <div style="font-weight:650;margin-bottom:8px">${it.name}</div>
      <div class="row"><label>Width</label><input type="number" id="pw" value="${it.w}" step="1" min="5"> <span style="color:var(--muted)">cm</span></div>
      <div class="row"><label>Depth</label><input type="number" id="pd" value="${it.d}" step="1" min="5"> <span style="color:var(--muted)">cm</span></div>
      <div class="row"><label>Rotation</label>
        <select id="pr">${[0,90,180,270].map(a=>`<option value="${a}" ${a===it.rot?"selected":""}>${a}°</option>`).join("")}</select></div>
      <div class="row"><label>Room</label><input type="text" value="${room?room.name:"— outside —"}" disabled></div>
      <div class="row"><label>Note</label><input type="text" id="pn" value="${it.note||""}" placeholder="colour, shop…"></div>
      <div class="row"><label>Price</label><input type="text" id="pp" value="${it.price||""}" placeholder="optional"></div>
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn" id="pRot">Rotate</button>
        <button class="btn" id="pDup">Duplicate</button>
        <button class="btn" id="pDel">Delete</button>
      </div>
    </div>`;
  const upd=()=>{
    it.w=+document.getElementById("pw").value||it.w;
    it.d=+document.getElementById("pd").value||it.d;
    it.rot=+document.getElementById("pr").value;
    it.note=document.getElementById("pn").value;
    it.price=document.getElementById("pp").value;
    render(); refreshBom();
  };
  ["pw","pd","pr","pn","pp"].forEach(id=>{
    const n=document.getElementById(id);
    n.addEventListener("change",()=>{pushUndo();upd();});
    n.addEventListener("input",upd);
  });
  document.getElementById("pRot").onclick=rotSel;
  document.getElementById("pDup").onclick=dupSel;
  document.getElementById("pDel").onclick=delSel;
  checkWarnings();
}

function checkWarnings(){
  const out=[];
  for(const it of S.items){
    const b=bbox(it), room=roomAt(it.x,it.y);
    if(!room){ out.push(`<b>${it.name}</b> is outside the flat.`); continue; }
    for(const w of WALLS){
      if(overlap(b,{x:w[0],y:w[1],w:w[2],h:w[3]})){
        out.push(`<b>${it.name}</b> runs into a wall in ${room.name}.`); break;
      }
    }
  }
  for(let i=0;i<S.items.length;i++) for(let j=i+1;j<S.items.length;j++){
    const a=S.items[i], c=S.items[j];
    if(a.name.startsWith("Rug")||c.name.startsWith("Rug")) continue;
    if(overlap(bbox(a),bbox(c))) out.push(`<b>${a.name}</b> overlaps <b>${c.name}</b>.`);
  }
  const uniq=[...new Set(out)].slice(0,8);
  document.getElementById("warns").innerHTML =
    uniq.length ? uniq.map(w=>`<div class="warn">⚠ ${w}</div>`).join("") : "";
}

function bomRows(){
  const map=new Map();
  for(const it of S.items){
    const room=roomAt(it.x,it.y);
    const key=[it.name,it.w,it.d,room?room.name:"—",it.note||"",it.price||""].join("|");
    if(map.has(key)) map.get(key).qty++;
    else map.set(key,{name:it.name,w:it.w,d:it.d,room:room?room.name:"—",
                      note:it.note||"",price:it.price||"",qty:1});
  }
  return [...map.values()].sort((a,b)=>a.room.localeCompare(b.room)||a.name.localeCompare(b.name));
}
function refreshBom(){
  const rows=bomRows();
  const total=rows.reduce((s,r)=>{
    const v=parseFloat(String(r.price).replace(/[^0-9.]/g,""));
    return s+(isFinite(v)?v*r.qty:0);
  },0);
  document.getElementById("bom").innerHTML = rows.length
    ? `<table class="bom"><tr><th>Item</th><th>Room</th><th class="n">Size (cm)</th><th class="n">Qty</th></tr>`
      + rows.map(r=>`<tr><td>${r.name}${r.note?`<br><span style="color:#8b95a1">${r.note}</span>`:""}</td>
          <td>${r.room}</td><td class="n">${Math.round(r.w)} × ${Math.round(r.d)}</td>
          <td class="n">${r.qty}</td></tr>`).join("") + `</table>`
    : '<div class="empty">No furniture placed yet.</div>';

  const tf = total>0 ? `<tfoot><tr><td colspan="5">Total</td><td class="n">${total.toFixed(2)}</td></tr></tfoot>` : "";
  document.getElementById("bomPrint").innerHTML = rows.length
    ? `<table><tr><th>Item</th><th>Room</th><th>Size (cm)</th><th>Qty</th><th>Note</th><th>Price</th></tr>`
      + rows.map(r=>`<tr><td>${r.name}</td><td>${r.room}</td>
          <td class="n">${Math.round(r.w)} × ${Math.round(r.d)}</td><td class="n">${r.qty}</td>
          <td>${r.note}</td><td class="n">${r.price}</td></tr>`).join("") + tf + `</table>`
    : "<p>No furniture placed.</p>";
  checkWarnings();
}

/* =====================================================================
   8. CATALOGUE UI
   ===================================================================== */
function buildCatalog(filter=""){
  const host=document.getElementById("cats"); host.innerHTML="";
  const f=filter.trim().toLowerCase();
  for(const c of CATS){
    const items=CATALOG.filter(i=>i.cat===c.key && (!f||i.name.toLowerCase().includes(f)));
    if(!items.length) continue;
    const d=document.createElement("details");
    d.className="grp"; d.open=!!f||c.key==="living";
    d.style.setProperty("--sw",c.color);
    d.innerHTML=`<summary>${c.name} <span style="color:var(--muted);font-weight:400">(${items.length})</span></summary>`;
    for(const i of items){
      const row=document.createElement("div");
      row.className="it"; row.draggable=true;
      row.innerHTML=`<span>${i.name}</span><span class="d">${i.w}×${i.d}</span>`;
      row.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",i.id));
      row.addEventListener("click",()=>addItem(i.id));
      d.appendChild(row);
    }
    host.appendChild(d);
  }
}

/* =====================================================================
   9. SAVE / LOAD / EXPORT
   ===================================================================== */
const KEY="apt-planner-v2";
function save(){ localStorage.setItem(KEY,JSON.stringify({items:S.items,uid}));
  flash(document.getElementById("bSave"),"Saved ✓"); }
function load(){
  try{ const raw=localStorage.getItem(KEY); if(!raw) return;
    const o=JSON.parse(raw); S.items=o.items||[]; uid=o.uid||S.items.length+1;
  }catch(e){}
}
function flash(btn,txt){ const t=btn.textContent; btn.textContent=txt;
  setTimeout(()=>btn.textContent=t,1200); }
function dl(href,name){ const a=document.createElement("a");
  a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function exportJson(){
  dl(URL.createObjectURL(new Blob([JSON.stringify({items:S.items},null,2)],
     {type:"application/json"})),"apartment-layout.json");
}
function importJson(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ pushUndo(); S.items=JSON.parse(r.result).items||[];
      uid=S.items.length+1; select(null); refreshBom(); }
      catch(e){ alert("Could not read that file."); } };
    r.readAsText(f); };
  inp.click();
}
function exportPng(){
  const vb=BOUNDS, keep={...S.view}, keepSel=S.sel;
  S.sel=null; S.view={x:vb.x,y:vb.y,w:vb.w}; render();
  const clone=svg.cloneNode(true);
  clone.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  clone.setAttribute("width",vb.w*2); clone.setAttribute("height",vb.h*2);
  const s=new XMLSerializer().serializeToString(clone);
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement("canvas");
    cv.width=vb.w*2; cv.height=vb.h*2;
    const cx=cv.getContext("2d");
    cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0);
    dl(cv.toDataURL("image/png"),"apartment-plan.png");
    S.view=keep; S.sel=keepSel; render();
  };
  img.onerror=()=>{ S.view=keep; S.sel=keepSel; render(); alert("PNG export failed."); };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}

/* =====================================================================
   10. WIRE-UP
   ===================================================================== */
function fit(){
  const ar=stage.clientWidth/stage.clientHeight;
  S.view.w=(BOUNDS.w/BOUNDS.h>ar)?BOUNDS.w:BOUNDS.h*ar;
  S.view.x=BOUNDS.x-(S.view.w-BOUNDS.w)/2;
  S.view.y=BOUNDS.y-(viewH()-BOUNDS.h)/2;
  render();
}
const $=id=>document.getElementById(id);
$("bRot").onclick=rotSel; $("bDel").onclick=delSel; $("bDup").onclick=dupSel;
$("bUndo").onclick=undo;  $("bFit").onclick=fit;
$("bZi").onclick=()=>{S.view.w/=1.25;render();};
$("bZo").onclick=()=>{S.view.w*=1.25;render();};
$("bSave").onclick=save;  $("bExport").onclick=exportJson;
$("bImport").onclick=importJson; $("bPng").onclick=exportPng;
$("bPrint").onclick=()=>{ const s=S.sel; S.sel=null; render();
  setTimeout(()=>{ window.print(); S.sel=s; render(); },60); };
$("bGrid").onclick=e=>{ S.showGrid=!S.showGrid; e.target.classList.toggle("on",S.showGrid); render(); };
$("bLabels").onclick=e=>{ S.showLabels=!S.showLabels; e.target.classList.toggle("on",S.showLabels); render(); };
$("bTape").onclick=e=>{ S.tapeMode=!S.tapeMode; e.target.classList.toggle("on",S.tapeMode);
  svg.style.cursor=S.tapeMode?"crosshair":"default"; if(!S.tapeMode) S.tape=null; render(); };
$("search").addEventListener("input",e=>buildCatalog(e.target.value));

document.addEventListener("keydown",e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==="r"||e.key==="R") rotSel();
  else if(e.key==="d"||e.key==="D") dupSel();
  else if(e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); delSel(); }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  else if(e.key==="Escape"){ S.tape=null; select(null); }
});
window.addEventListener("resize",render);

buildCatalog(); load();
$("bGrid").classList.add("on"); $("bLabels").classList.add("on");
fit(); refreshBom(); showProps();
</script>
